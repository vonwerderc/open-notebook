name: Build OpenCode Go runtime image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  VERSIONED_TAG: ghcr.io/vonwerderc/open-notebook:v1.14.0-opencodego.1
  CHANNEL_TAG: ghcr.io/vonwerderc/open-notebook:v1-opencodego

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout merged main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.VERSIONED_TAG }}
            ${{ env.CHANNEL_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record digest
        run: |
          DIGEST=$(docker buildx imagetools inspect "$VERSIONED_TAG" --format '{{json .Manifest.Digest}}')
          {
            echo "### Image published"
            echo "- Versioned tag: \`$VERSIONED_TAG\`"
            echo "- Channel tag: \`$CHANNEL_TAG\`"
            echo "- Digest: $DIGEST"
            echo "- Source commit: \`$(git rev-parse HEAD)\`"
          } >> "$GITHUB_STEP_SUMMARY"
